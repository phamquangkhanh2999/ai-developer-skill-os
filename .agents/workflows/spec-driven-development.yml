name: spec-driven-development
version: 10.2.0
platforms: [antigravity, claude, opencode]
runtime_version: 1
description: "Pipeline phát triển dựa trên đặc tả: Requirement → Acceptance Criteria → Technical Spec → Implementation."

owner:
  type: engineering
  maintained_by: qk-team

verification_profile: spec-driven

triggers:
  - "viết spec"
  - "viết prd"
  - "acceptance criteria"
  - "bdd"

ide_binding:
  slash_command: "/spec"
  aliases: ["/prd", "/specify"]

steps:
  - id: triage
    name: "Triage & Clarify"
    purpose: "Xác định quy mô task và kích hoạt /grill-me nếu thiếu thông tin"
    required: true
    outputs:
      - task_scale
      - clarity_level
    actions:
      - "Xác định Nhỏ/Vừa/Lớn"
      - "Kích hoạt /grill-me nếu thiếu thông tin"

  - id: gap_scan
    name: "Codebase Gap Scan"
    purpose: "Đối chiếu models & APIs hiện có để đánh giá khả thi"
    required: true
    outputs:
      - reusable_components
      - new_requirements
    actions:
      - "Quét codebase cho models, APIs hiện có"
      - "Xác định Gap Analysis"

  - id: bdd_write
    name: "BDD Spec Writing"
    purpose: "Viết Acceptance Criteria chuẩn Gherkin"
    required: true
    outputs:
      - bdd_scenarios
      - acceptance_criteria
    actions:
      - "Viết Given/When/Then cho Happy Path + Edge Cases"
    human_checkpoint:
      condition: "Task scale = Lớn"
      message: "Feature lớn. Xác nhận BDD spec trước khi tiếp tục."

  - id: plan
    name: "Implementation Plan"
    purpose: "Tạo implementation_plan.md và kích hoạt modal"
    required: true
    outputs:
      - implementation_plan_path
    actions:
      - "Tạo implementation_plan.md với RequestFeedback: true"
    human_checkpoint:
      condition: "Always"
      message: "Review implementation_plan trước khi code."

  - id: verify
    name: "Verify Against Spec"
    purpose: "Xác nhận implementation match spec"
    required: true
    outputs:
      - spec_compliance
    actions:
      - "Đối chiếu từng acceptance criteria"
      - "Verify edge cases covered"
    exit_on_fail: PARTIAL

escalation:
  max_retries: 1
  on_failure: "Report spec compliance gaps and ask user to update spec"

# ── V10.2 Additions ──────────────────────────────
# Confidence Model
# | Level  | Condition              | Action       |
# |--------|------------------------|--------------|
# | HIGH   | Step inputs provided   | Proceed      |
# | MEDIUM | Some assumptions needed | Note assumptions |
# | LOW    | Insufficient evidence  | EXIT: BLOCKED|
#
# Exit Codes
# | Code    | Meaning                       | When                    |
# |---------|-------------------------------|-------------------------|
# | SUCCESS | Step completed and verified   | All criteria met        |
# | PARTIAL | Step done with minor gaps    | Some checks skipped     |
# | BLOCKED | Missing precondition         | Ask user                |
# | FAILED  | Step failed after max retries | Report error            |
#
# Evidence Format:
#   [SEVERITY] step_id: [step-name]
#   Reason:     [why this matters]
#   Confidence: [HIGH|MEDIUM|LOW]
#   Fix:        [suggestion]
#
# Compliance:
#   Runtime Standard: 11/11
#   Frontmatter Complete: yes
#   References Valid: yes
#   Decision Trees: PASS
#   Thresholds Defined: PASS
#   schema_version: 10.2.0
#   runtime_version: 1
#   platforms: [antigravity, claude, opencode]
