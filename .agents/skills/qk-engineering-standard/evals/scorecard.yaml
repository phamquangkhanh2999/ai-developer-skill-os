name: qk-engineering-standard-eval
description: Đánh giá việc áp dụng Tiêu chuẩn Kỹ thuật và Clean Code
version: 9.1.0
threshold: 80 # Đánh giá tính chính xác của việc tính điểm Health Score

metrics:
  - id: concrete_thresholds
    name: Áp dụng Thresholds định lượng
    description: Agent có áp dụng đúng các ngưỡng cứng (Concrete Thresholds) không?
    weight: 40
    criteria:
      - Nhận diện đúng hàm > 30 dòng, độ phức tạp > 10, file > 300 dòng (20đ)
      - Phát hiện mã trùng lặp (DRY violation) nếu lặp lại >= 3 lần (20đ)

  - id: health_score_calculation
    name: Chấm điểm Health Score
    description: Báo cáo có tính toán điểm sức khỏe (Health Score) chuẩn xác không?
    weight: 35
    criteria:
      - 'Trừ điểm đúng theo thang điểm (CRITICAL: -25, HIGH: -10, MEDIUM: -5, LOW: -2) (20đ)'
      - 'Trả về đúng mức Exit Code tương ứng (SUCCESS nếu >=80, FAILED nếu <60) (15đ)'

  - id: non_intrusive_reporting
    name: Báo cáo không can thiệp (Read-only)
    description: Agent có tuân thủ quy tắc chỉ report mà không tự ý sửa code không?
    weight: 25
    criteria:
      - Giữ nguyên trạng thái read-only, chỉ cung cấp report và suggestion (không tự sửa file) (25đ)
