# Learning Schema — V10.2
# Defines the required structure for all learning files.

schema_version: 10.2.0

# ── Required fields ────────────────────────────────
required:
  skill:
    type: string
    pattern: "^qk-[a-z-]+$"
    example: "qk-bug-resolution"
  topic:
    type: string
    example: "triangulate-technique"
  evidence:
    type: array
    items: string
    example: ["test-passed", "code-reviewed"]
  validated_at:
    type: string
    format: date-time

# ── Optional fields ────────────────────────────────
optional:
  confidence:
    type: enum
    values: [HIGH, MEDIUM, LOW]
  source:
    type: string
    description: "Where this learning was validated"
  applies_to:
    type: array
    items: string
    example: ["qk-bug-resolution", "qk-code-cleaner"]
