# Skill Schema — V10.2
# This file defines the required and optional fields for all SKILL.md frontmatter.
# Every skill MUST conform to this schema. Validator: tooling/validate-skills.js

schema_version: 10.2.0

# ── Identity ────────────────────────────────────────────
name:
  type: string
  pattern: "^qk-[a-z-]+$"
  example: "qk-bug-resolution"

version:
  type: semver
  example: "10.2.0"

status:
  type: enum
  values: [stable, experimental, deprecated]

description:
  type: string
  maxLength: 200
  example: "Chẩn đoán nguyên nhân gốc rễ và khắc phục lỗi mã nguồn."

platforms:
  type: array
  items: [antigravity, claude, opencode]
  description: "Which IDEs this skill supports"
  example: [antigravity, claude, opencode]

runtime_version:
  type: integer
  default: 1

type:
  type: enum
  values: [capability, utility, orchestrator]
  example: "capability"

# ── Classification ──────────────────────────────────────
intent:
  type: array
  minItems: 1
  example: [bug-fixing, debugging]

complexity:
  type: object
  required_fields: [level]
  optional_fields: [criteria]
  levels: [low, medium, high, critical]

triggers:
  type: array
  minItems: 2
  description: "Keywords that cause AI to select this skill"
  example: ["fix bug", "lỗi", "crash"]

selection:
  type: object
  required_fields: [priority]
  optional_fields: [confidence_threshold, fallback_skill]
  priority:
    type: enum
    values: [high, medium, low]
  confidence_threshold:
    type: number
    default: 0.75
    range:
      min: 0.0
      max: 1.0
  fallback_skill:
    type: string
    optional: true

# ── References ──────────────────────────────────────────
workflow:
  type: string
  description: "References workflows/<name>.yml"
  example: "bug-resolution"

rules:
  type: array
  example: [global]

tools:
  type: array
  example: [filesystem]

# ── Runtime ─────────────────────────────────────────────
execution_mode:
  type: enum
  values: [deterministic]

token_budget:
  type: object
  required_fields: [max_files_read, max_lines_per_read, max_shell_commands, stop_early]

# ── V10 Required Sections ───────────────────────────────
exit_codes:
  type: object
  required_fields: [SUCCESS, PARTIAL, BLOCKED, FAILED]
  description: "Each exit code with meaning and when"

confidence_model:
  type: object
  levels: [HIGH, MEDIUM, LOW]
  description: "Confidence levels for evidence-based routing"

compliance:
  type: object
  required_fields: [schema_version, runtime_version, platforms]
  description: "Compliance check block at end of SKILL.md"

# ── Optional fields ─────────────────────────────────────
optional:
  related_skills:
    type: array
    description: "Skills often used together"
  knowledge_scope:
    type: object
    fields: [owns, references]
  cost:
    type: enum
    values: [low, medium, high]
  latency:
    type: enum
    values: [fast, medium, slow]
  risk:
    type: enum
    values: [low, medium, high]
  side_effects:
    type: enum
    values: [edit_files, run_commands, read_only, none]
  produces:
    type: array
    items: [code, report, schema, plan, tokens]
  consumes:
    type: array
  verification:
    type: object
    required_fields: [required, strategy]
    strategies: [bug-fix, refactor, feature, documentation, review]
