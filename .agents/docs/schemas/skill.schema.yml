# Skill Schema — Antigravity Runtime
# This file defines the required and optional fields for all SKILL.md frontmatter.
# Every skill MUST conform to this schema. Validator: tooling/validate-skills.js

schema_version: 13.0.0

# ── Required Fields ─────────────────────────────────────
name:
  type: string
  required: true
  pattern: "^qk-[a-z0-9-]+$"
  example: "qk-bug-resolution"

version:
  type: semver
  required: true
  example: "13.0.0"

status:
  type: enum
  required: true
  values: [stable, experimental, deprecated]

description:
  type: string
  required: true
  maxLength: 240
  example: "Chẩn đoán nguyên nhân gốc rễ và khắc phục lỗi mã nguồn."

platforms:
  type: array
  required: true
  items: [antigravity]
  description: "Supported runtime; this package targets Antigravity only"
  example: [antigravity]

runtime_version:
  type: integer
  required: true
  default: 1

triggers:
  type: array
  required: true
  minItems: 1
  description: "Natural-language phrases that route tasks to this skill"
  example: ["fix bug", "sửa lỗi", "crash"]

rules:
  type: array
  required: true
  description: "Rule file basenames under .agents/rules/ (without .md extension)"
  example: [global, coding, safety]

# ── Optional Fields ─────────────────────────────────────
optional:
  subtitle:
    type: string
    description: "Short display subtitle for documentation and UI"
  references:
    type: array
    items:
      type: string
    description: "Optional list of relative paths from skill folder to on-demand references"
    example: ["../../references/ui.md"]
  tools:
    type: array
    description: "Advisory tool labels; do not grant runtime permissions"
    example: [filesystem]
  dependencies:
    type: array
    description: "Optional skill-to-skill dependencies validated by tooling/build-registry.js"
