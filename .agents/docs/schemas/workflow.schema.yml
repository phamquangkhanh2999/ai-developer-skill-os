# Workflow Schema — V10.2
# See workflows/_schema.yml for the full machine-readable schema.
# This file is for human reference.

schema_version: 10.2.0

# ── Required top-level fields ──────────────────────
required:
  - name          # string: workflow identifier (kebab-case)
  - version       # semver: 10.x.x
  - description   # string: what this pipeline does
  - owner
  - steps

# ── Owner ──────────────────────────────────────────
owner:
  type: engineering
  maintained_by: qk-team

# ── Steps ──────────────────────────────────────────
steps:
  - id: string          # Unique step identifier
    name: string        # Display name
    purpose: string     # What this step achieves
    required: boolean   # Whether step is mandatory
    outputs:            # Array of output names
      - string
    actions:            # Array of action descriptions
      - string
    human_checkpoint:   # Optional human approval
      condition: string
      message: string
    exit_on_fail:       # What to do on failure
      - PARTIAL
      - BLOCKED
      - FAILED

# ── Escalation ─────────────────────────────────────
escalation:
  max_retries: integer
  on_failure: string

# ── Example ────────────────────────────────────────
example: |
  name: bug-resolution
  version: 10.2.0
  description: "Pipeline chuẩn để diagnose và fix bugs."
  owner:
    type: engineering
    maintained_by: qk-team
  steps:
    - id: understand
      name: "Hiểu yêu cầu"
      purpose: "Nhận diện mục tiêu cốt lõi"
      required: true
  escalation:
    max_retries: 2
    on_failure: "Report error and ask user"
