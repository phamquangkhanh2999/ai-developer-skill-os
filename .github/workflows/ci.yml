name: CI / Spec Compliance & Registry Validation
on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.agents/registry/**'
      - '.agents/rules/**'
      - '.agents/references/**'
      - '.agents/docs/**'
      - '.agents/blueprints/**'
      - '.agents/AGENTS.md'
      - '.agents/skill-aliases.yml'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'tests/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'bin/**'
      - 'tooling/**'
  push:
    branches: [ main ]
    paths:
      - '.agents/skills/**'
      - '.agents/registry/**'
      - '.agents/rules/**'
      - '.agents/references/**'
      - '.agents/docs/**'
      - '.agents/blueprints/**'
      - '.agents/AGENTS.md'
      - '.agents/skill-aliases.yml'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'tests/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'bin/**'
      - 'tooling/**'
jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Validate Skills Registry vs Filesystem
        run: npm run test:registry
      - name: Validate SKILL.md Spec Compliance
        run: npm run lint
      - name: Validate Graph Integrity
        run: npm run test:graph
  antigravity-install-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Smoke-test Antigravity local install in isolation
        env:
          HOME: ${{ runner.temp }}/antigravity-home
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/antigravity-workspace"
          cd "$RUNNER_TEMP/antigravity-workspace"
          node "$GITHUB_WORKSPACE/bin/install.js" --ide=antigravity --scope=local
          test -f .agents/AGENTS.md
          test -f .agents/skills/qk-feature-delivery/SKILL.md
          test -f GEMINI.md
