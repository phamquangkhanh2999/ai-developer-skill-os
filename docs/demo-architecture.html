<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Developer Skill OS — Governed Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --color-link:   #2e5aa8;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 400;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Spec Test</p>
    <h1>AI Developer Skill OS — Governed Execution Pipeline</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diag-title diag-desc">
        <title id="diag-title">AI Developer Skill OS Architecture</title>
        <desc id="diag-desc">Governed execution pipeline from developer prompt through safety hooks, O(1) routing, core skills to verified evidence handoff.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- 1. Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 2. Zone: Governed Runtime Boundary (drawn before arrows and nodes) -->
        <rect x="220" y="70" width="480" height="260" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="236" y="76" width="170" height="14" rx="2" fill="#f5f5f5"/>
        <text x="321" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.12em">GOVERNED RUNTIME BOUNDARY</text>

        <!-- 3. Connectors (Z-index: drawn before nodes) -->
        <!-- Connector 1: User -> Host (Orthogonal with r=8) -->
        <path d="M 170,240 H 192 Q 200,240 200,232 V 148 Q 200,140 208,140 H 242"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Connector 2: Host -> Safety Hooks -->
        <line x1="420" y1="140" x2="482" y2="140"
              stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector 3: Safety Hooks -> Skill Router (Focal path with Accent) -->
        <line x1="580" y1="170" x2="580" y2="232"
              stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- Connector 4: Skill Router -> Core Skills -->
        <line x1="490" y1="270" x2="428" y2="270"
              stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector 5: Core Skills -> Workspace -->
        <line x1="335" y1="300" x2="335" y2="362"
              stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector 6: Workspace -> Evidence Report -->
        <line x1="250" y1="400" x2="178" y2="400"
              stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector 7: Evidence Report -> User (Return) -->
        <line x1="105" y1="370" x2="105" y2="278"
              stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 4. Connector Labels with Masking Plates (6-10px visible clearance) -->
        <!-- Label 1 -->
        <rect x="178" y="218" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="227" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

        <!-- Label 2 -->
        <rect x="428" y="124" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="454" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRETOOL</text>

        <!-- Label 3 (Focal) -->
        <rect x="590" y="196" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="205" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOVERNED</text>

        <!-- Label 4 -->
        <rect x="435" y="254" width="50" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <!-- Label 5 -->
        <rect x="345" y="326" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="371" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MUTATE</text>

        <!-- Label 6 -->
        <rect x="185" y="384" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="213" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVIDENCE</text>

        <!-- Label 7 -->
        <rect x="115" y="318" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="141" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF</text>

        <!-- 5. Nodes (drawn after connectors) -->
        <!-- Node 1: User -->
        <rect x="40" y="210" width="130" height="60" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="218" width="30" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="63" y="227" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="105" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Developer</text>
        <text x="105" y="259" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Input Task</text>

        <!-- Node 2: Antigravity Host -->
        <rect x="250" y="110" width="170" height="60" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="258" y="118" width="30" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="273" y="127" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="335" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Antigravity IDE</text>
        <text x="335" y="159" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gemini 3.8 / Adapter</text>

        <!-- Node 3: Safety Hooks -->
        <rect x="490" y="110" width="180" height="60" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="498" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="516" y="127" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
        <text x="580" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Safety Hooks</text>
        <text x="580" y="159" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hooks.json Guardrail</text>

        <!-- Node 4: Skill Router (FOCAL ELEMENT - 1 Focal Accent) -->
        <rect x="490" y="240" width="180" height="60" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="498" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="518" y="257" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
        <text x="580" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skill Router</text>
        <text x="580" y="289" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">O(1) Graph & Registry</text>

        <!-- Node 5: 5 Core Skills -->
        <rect x="250" y="240" width="170" height="60" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="258" y="248" width="38" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="277" y="257" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILLS</text>
        <text x="335" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 Core Skills</text>
        <text x="335" y="289" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">feature / bug / review...</text>

        <!-- Node 6: Workspace & Tools -->
        <rect x="250" y="370" width="170" height="60" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="258" y="378" width="38" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="277" y="387" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
        <text x="335" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workspace & Tools</text>
        <text x="335" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Files, Shell, MCP</text>

        <!-- Node 7: Verified Handoff -->
        <rect x="40" y="370" width="130" height="60" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="378" width="38" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="67" y="387" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>
        <text x="105" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verified Handoff</text>
        <text x="105" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tầng 0-2 Checks</text>
      </svg>
    </div>
  </div>
</body>
</html>
