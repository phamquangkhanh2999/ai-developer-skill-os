<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Authentication Sequence — Diagram Spec</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --color-link:   #2e5aa8;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 400;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Spec</p>
    <h1>User Login & Token Issuance Flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-title auth-desc">
        <title id="auth-title">User Authentication Sequence</title>
        <desc id="auth-desc">Secure user login flow with password hashing verification and dual JWT token issuance.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- 1. Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 2. Lifelines (Z-index: drawn behind everything) -->
        <line x1="130" y1="146" x2="130" y2="520" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="370" y1="146" x2="370" y2="520" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="600" y1="146" x2="600" y2="520" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="830" y1="146" x2="830" y2="520" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- Activation Boxes -->
        <rect x="125" y="180" width="10" height="320" rx="2" fill="#ececec" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="365" y="186" width="10" height="308" rx="2" fill="#ececec" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="595" y="234" width="10" height="216" rx="2" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <rect x="825" y="284" width="10" height="116" rx="2" fill="#ececec" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- 3. Message Connectors -->
        <!-- Msg 1: Client -> Gateway (HTTPS Link Blue) -->
        <line x1="135" y1="190" x2="357" y2="190" stroke="#2e5aa8" stroke-width="1.3" marker-end="url(#arrow-link)"/>

        <!-- Msg 2: Gateway -> Auth Service (gRPC Internal) -->
        <line x1="375" y1="238" x2="587" y2="238" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Msg 3: Auth Service -> DB (SQL Query) -->
        <line x1="605" y1="288" x2="817" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Msg 4: DB -> Auth Service (Data Return - Dashed) -->
        <line x1="825" y1="338" x2="613" y2="338" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Msg 5: Auth Service -> Redis (Session Cache) -->
        <line x1="605" y1="388" x2="817" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Msg 6: Auth Service -> Gateway (FOCAL ACCENT: Token Pair Issued) -->
        <line x1="595" y1="438" x2="383" y2="438" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- Msg 7: Gateway -> Client (200 OK + Cookies - Dashed) -->
        <line x1="365" y1="488" x2="143" y2="488" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 4. Message Labels with Opaque Mask Plates (gap 6-10px from stroke) -->
        <!-- Label 1 -->
        <rect x="180" y="174" width="138" height="13" rx="2" fill="#f5f5f5"/>
        <text x="249" y="183" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /api/v1/auth/login</text>

        <!-- Label 2 -->
        <rect x="424" y="222" width="112" height="13" rx="2" fill="#f5f5f5"/>
        <text x="480" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">gRPC: Authenticate()</text>

        <!-- Label 3 -->
        <rect x="652" y="272" width="120" height="13" rx="2" fill="#f5f5f5"/>
        <text x="712" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SELECT user BY email</text>

        <!-- Label 4 -->
        <rect x="646" y="322" width="132" height="13" rx="2" fill="#f5f5f5"/>
        <text x="712" y="331" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Record + Argon2 Hash</text>

        <!-- Label 5 -->
        <rect x="650" y="372" width="124" height="13" rx="2" fill="#f5f5f5"/>
        <text x="712" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SETEX session:{id} 7d</text>

        <!-- Label 6 (Focal Accent) -->
        <rect x="410" y="422" width="144" height="13" rx="2" fill="#f5f5f5"/>
        <text x="482" y="431" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">JWT Token Pair (Access+Refresh)</text>

        <!-- Label 7 -->
        <rect x="175" y="472" width="150" height="13" rx="2" fill="#f5f5f5"/>
        <text x="250" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">200 OK: HttpOnly Cookie + Body</text>

        <!-- 5. Participant Header Boxes (drawn after lines) -->
        <!-- P1: Client App -->
        <rect x="60" y="90" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="68" y="97" width="28" height="11" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="82" y="105" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="130" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser / App</text>
        <text x="130" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React / iOS</text>

        <!-- P2: API Gateway -->
        <rect x="300" y="90" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="308" y="97" width="34" height="11" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="325" y="105" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGRESS</text>
        <text x="370" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Gateway</text>
        <text x="370" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Traefik / Envoy</text>

        <!-- P3: Auth Service (1 Focal Accent) -->
        <rect x="525" y="90" width="150" height="56" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.5"/>
        <rect x="533" y="97" width="30" height="11" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="548" y="105" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
        <text x="600" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth Service</text>
        <text x="600" y="136" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Node / Golang</text>

        <!-- P4: Database & Redis -->
        <rect x="755" y="90" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#5a6580" stroke-width="1"/>
        <rect x="763" y="97" width="32" height="11" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="779" y="105" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="830" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL / Redis</text>
        <text x="830" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cluster :5432 / :6379</text>
      </svg>
    </div>
  </div>
</body>
</html>
